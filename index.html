    <title>EduClass Lớp 5 - Nền Tảng Học Tập & Luyện Thi Thông Minh</title>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-sky-200 selection:text-sky-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up legacy PWA Service Worker & Cache on existing devices
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          });
        }
      }
    </script>
  </body>
</html>
